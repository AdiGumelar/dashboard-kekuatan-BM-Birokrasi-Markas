<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle matching the app navbar logo -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Building2 Icon / Markas Architecture (White with subtle shadow) -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#shadow)">
    <!-- Central Tower / Gedung Pusat -->
    <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Wing / Sayap Kiri -->
    <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Wing / Sayap Kanan -->
    <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Architectural Windows -->
    <path d="M10 6h4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 10h4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 14h4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 18h4" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent Status Badge (Markas / Status Aktif) -->
  <circle cx="51" cy="13" r="5" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2"/>
</svg>
